<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — My Portfolio</title>
  <meta property="og:title" content="Get In Touch">
  <meta property="og:description" content="Send me a message.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">MyPortfolio</a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
          <li><button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <h1 class="section-title">Get In Touch</h1>

    <form class="contact-form" id="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="What's on your mind?"></textarea>
      </div>
      <button type="submit" class="submit-btn">Send Message</button>
      <div class="form-status" id="form-status"></div>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Portfolio · Built with HTML, CSS &amp; JavaScript</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
